            function renderFolders() {
                foldersNav.innerHTML = state.folders.map(folder => `
                    <button class="folder-tab flex-shrink-0 px-4 py-2 rounded-full text-sm font-bold border transition-all
                        ${state.currentFolder?.name === folder.name 
                            ? 'active' 
                            : 'bg-transparent border-gold-accent/30 text-pearl-dim hover:border-gold-accent/60'}"
                        data-folder="${folder.name}">
                        ${folder.name} (${folder.count})
                    </button>
                `).join('');
                
                document.querySelectorAll('.folder-tab').forEach(tab => {
                    tab.addEventListener('click', (e) => {
                        const folderName = e.currentTarget.dataset.folder;
                        state.currentFolder = state.folders.find(f => f.name === folderName);
                        state.currentPatient = null;
                        renderFolders();
                        renderPatients();
                        clearPatientForm();
                    });
                });
            }

            // Renderizado de pacientes
            function renderPatients() {
                let patientsToShow = state.patients;
                
                if (state.currentFolder) {
                    patientsToShow = patientsToShow.filter(p => p.folder === state.currentFolder.name);
                }
                
                if (state.searchTerm) {
                    const term = state.searchTerm.toLowerCase();
                    patientsToShow = patientsToShow.filter(p => 
                        p.nombres.toLowerCase().includes(term) ||
                        p.apellidos.toLowerCase().includes(term) ||
                        p.cedula.toLowerCase().includes(term) ||
                        (p.telefono && p.telefono.includes(term))
                    );
                }
                
                if (patientsToShow.length === 0) {
                    patientList.innerHTML = `
                        <div class="flex-shrink-0 w-full text-center py-4 text-pearl-dim italic text-sm">
                            No se encontraron pacientes
                        </div>
                    `;
                } else {
                    patientList.innerHTML = patientsToShow.map(patient => `
                        <div class="patient-item flex-shrink-0 w-52 bg-navy-medium/40 rounded-lg p-3 border border-gold-accent/20 cursor-pointer hover:bg-navy-medium/60 transition-all
                            ${state.currentPatient?.id === patient.id ? 'active' : 'opacity-80'}"
                            data-patient-id="${patient.id}">
                            <div class="flex items-center gap-2 mb-2">
                                <div class="w-10 h-10 rounded-full bg-gold-accent/20 flex items-center justify-center overflow-hidden">
                                    ${patient.foto ? `<img src="${patient.foto}" class="w-full h-full object-cover">` : '<span class="material-symbols-outlined text-sm text-gold-accent">person</span>'}
                                </div>
                                <div class="flex-1 min-w-0">
                                    <p class="text-sm font-bold text-pearl-white truncate">${patient.nombres}</p>
                                    <p class="text-xs text-pearl-dim truncate">${patient.apellidos}</p>
                                </div>
                            </div>
                            <div class="text-xs text-pearl-dim space-y-0.5">
                                <p>CI: ${patient.cedula}</p>
                                <p>Edad: ${patient.edad}</p>
                                ${patient.telefono ? `<p>📞 ${patient.telefono}</p>` : ''}
                            </div>
                        </div>
                    `).join('');
                    
                    document.querySelectorAll('.patient-item').forEach(item => {
                        item.addEventListener('click', (e) => {
                            const patientId = parseInt(e.currentTarget.dataset.patientId);
                            selectPatient(patientId);
                        });
                    });
                }
            }

            function selectPatient(patientId) {
                state.currentPatient = state.patients.find(p => p.id === patientId);
                if (state.currentPatient) {
                    fillPatientForm(state.currentPatient);
                    renderPatients();
                }
            }

            function fillPatientForm(patient) {
                document.getElementById('inputNombres').value = patient.nombres || '';
                document.getElementById('inputApellidos').value = patient.apellidos || '';
                document.getElementById('inputCedula').value = patient.cedula || '';
                document.getElementById('inputEdad').value = patient.edad || '';
                document.getElementById('inputTelefono').value = patient.telefono || '';
                document.getElementById('inputPatologia').value = patient.motivo || '';
                
                // Cargar notas clínicas
                const notasMotivo = document.querySelector('[data-field="notasMotivo"]');
                const notasDolor = document.querySelector('[data-field="notasDolor"]');
                const medicamentos = document.querySelector('[data-field="medicamentos"]');
                const indicaciones = document.querySelector('[data-field="indicaciones"]');
                
                if (notasMotivo) notasMotivo.value = patient.notasMotivo || '';
                if (notasDolor) notasDolor.value = patient.notasDolor || '';
                if (medicamentos) medicamentos.value = patient.medicamentos || '';
                if (indicaciones) indicaciones.value = patient.indicaciones || '';
                
                if (patient.dolor !== undefined) {
                    painRange.value = patient.dolor;
                    painValue.textContent = `${patient.dolor} / 10`;
                }
                
                // Cargar fotografía
                loadPatientPhoto(patient);
            }

            function loadPatientPhoto(patient) {
                const container = document.getElementById('photoUploadContainer');
                const preview = document.getElementById('photoPreview');
                const removeBtn = document.getElementById('removePhotoBtn');
                
                if (patient.foto) {
                    preview.src = patient.foto;
                    container.classList.add('has-photo');
                    if (removeBtn) removeBtn.style.display = 'block';
                } else {
                    preview.src = '';
                    container.classList.remove('has-photo');
                    if (removeBtn) removeBtn.style.display = 'none';
                }
            }

            function clearPatientForm() {
                document.getElementById('inputNombres').value = '';
                document.getElementById('inputApellidos').value = '';
                document.getElementById('inputCedula').value = '';
                document.getElementById('inputEdad').value = '';
                document.getElementById('inputTelefono').value = '';
                document.getElementById('inputPatologia').value = '';
                painRange.value = 0;
                painValue.textContent = '0 / 10';
                
                document.querySelectorAll('textarea.auto-save').forEach(ta => ta.value = '');
                
                // Limpiar foto
                const container = document.getElementById('photoUploadContainer');
                const preview = document.getElementById('photoPreview');
                const removeBtn = document.getElementById('removePhotoBtn');
                preview.src = '';
                container.classList.remove('has-photo');
                if (removeBtn) removeBtn.style.display = 'none';
            }

            // Guardado automático
            function setupAutoSave() {
                document.querySelectorAll('.auto-save').forEach(element => {
                    element.addEventListener('input', () => {
                        if (!state.currentPatient) return;
                        
                        clearTimeout(state.autoSaveTimeout);
                        state.autoSaveTimeout = setTimeout(() => {
                            saveCurrentPatient();
                        }, 500);
                    });
                });
            }

            function saveCurrentPatient() {
                if (!state.currentPatient) return;
                
                const patient = state.currentPatient;
                patient.nombres = document.getElementById('inputNombres').value;
                patient.apellidos = document.getElementById('inputApellidos').value;
                patient.cedula = document.getElementById('inputCedula').value;
                patient.edad = parseInt(document.getElementById('inputEdad').value) || 0;
                patient.telefono = document.getElementById('inputTelefono').value;
                patient.motivo = document.getElementById('inputPatologia').value;
                patient.dolor = parseInt(painRange.value);
                
                // Guardar notas clínicas
                const notasMotivo = document.querySelector('[data-field="notasMotivo"]');
                const notasDolor = document.querySelector('[data-field="notasDolor"]');
                const medicamentos = document.querySelector('[data-field="medicamentos"]');
                const indicaciones = document.querySelector('[data-field="indicaciones"]');
                
                if (notasMotivo) patient.notasMotivo = notasMotivo.value;
                if (notasDolor) patient.notasDolor = notasDolor.value;
                if (medicamentos) patient.medicamentos = medicamentos.value;
                if (indicaciones) patient.indicaciones = indicaciones.value;
                
                showToast('Cambios guardados automáticamente');
                renderPatients();
            }

            function showToast(message) {
                const existingToast = document.querySelector('.toast');
                if (existingToast) existingToast.remove();
                
                const toast = document.createElement('div');
                toast.className = 'toast';
                toast.textContent = message;
                document.body.appendChild(toast);
                
                setTimeout(() => {
                    toast.remove();
                }, 2000);
            }

            // Manejo de fotografía
            window.handlePhotoUpload = function(event) {
                const file = event.target.files[0];
                if (!file) return;
                
                if (!state.currentPatient) {
                    alert('Seleccione un paciente primero');
                    return;
                }
                
                const reader = new FileReader();
                reader.onload = function(e) {
                    const photoData = e.target.result;
                    state.currentPatient.foto = photoData;
                    loadPatientPhoto(state.currentPatient);
                    showToast('Fotografía guardada');
                    renderPatients();
                };
                reader.readAsDataURL(file);
            };

            window.removePhoto = function() {
                if (!state.currentPatient) return;
                state.currentPatient.foto = null;
                loadPatientPhoto(state.currentPatient);
                showToast('Fotografía eliminada');
                renderPatients();
            };

            // Event listeners principales
            function setupEventListeners() {
                searchInput.addEventListener('input', (e) => {
                    state.searchTerm = e.target.value;
                    if (state.searchTerm) {
                        clearSearchBtn.classList.add('visible');
                    } else {
                        clearSearchBtn.classList.remove('visible');
                    }
                    renderPatients();
                });
                
                clearSearchBtn.addEventListener('click', () => {
                    searchInput.value = '';
                    state.searchTerm = '';
                    clearSearchBtn.classList.remove('visible');
                    renderPatients();
                    searchInput.focus();
                });
                
                addFolderBtn.addEventListener('click', () => {
                    const folderName = prompt('Nombre de la nueva carpeta:');
                    if (folderName && folderName.trim()) {
                        const name = folderName.trim();
                        if (!state.folders.find(f => f.name === name)) {
                            state.folders.push({ name, count: 0 });
                            state.currentFolder = state.folders[state.folders.length - 1];
                            renderFolders();
                            renderPatients();
                            clearPatientForm();
                            showToast(`Carpeta "${name}" creada`);
                        } else {
                            alert('Ya existe una carpeta con ese nombre');
                        }
                    }
                });
                
                newPatientBtn.addEventListener('click', () => {
                    if (!state.currentFolder) {
                        alert('Seleccione una carpeta primero');
                        return;
                    }
                    
                    const nombres = prompt('Nombres del paciente:');
                    if (!nombres) return;
                    
                    const apellidos = prompt('Apellidos del paciente:');
                    if (!apellidos) return;
                    
                    const cedula = prompt('Cédula del paciente:');
                    if (!cedula) return;
                    
                    const edad = prompt('Edad del paciente:');
                    if (!edad) return;
                    
                    const telefono = prompt('Teléfono del paciente (opcional):');
                    
                    const newPatient = {
                        id: Date.now(),
                        nombres,
                        apellidos,
                        cedula,
                        edad: parseInt(edad) || 0,
                        telefono: telefono || '',
                        folder: state.currentFolder.name,
                        motivo: '',
                        dolor: 0,
                        notasMotivo: '',
                        notasDolor: '',
                        medicamentos: '',
                        indicaciones: '',
                        foto: null
                    };
                    
                    state.patients.push(newPatient);
                    const folder = state.folders.find(f => f.name === state.currentFolder.name);
                    if (folder) folder.count++;
                    
                    state.currentPatient = newPatient;
                    renderFolders();
                    renderPatients();
                    fillPatientForm(newPatient);
                    showToast('Paciente creado exitosamente');
                });
                
                painRange.addEventListener('input', (e) => {
                    painValue.textContent = `${e.target.value} / 10`;
                });
                
                resetHomeBtn.addEventListener('click', () => {
                    state.currentFolder = state.folders[0];
                    state.currentPatient = null;
                    state.searchTerm = '';
                    searchInput.value = '';
                    clearSearchBtn.classList.remove('visible');
                    renderFolders();
                    renderPatients();
                    clearPatientForm();
                });
            }

            // Iniciar aplicación
            init();
        })();
    </script>
</body>
</html>
