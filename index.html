    @media (max-width: 800px) {

<body>

<script>
  (function() {
    const STORAGE_KEY = 'fn_sistem_patients_v2';
    const DEFAULT_FOLDER_ID = 'folder_001';

    // Regiones anatómicas
    const ANATOMY_REGIONS = [
      { id: 'cabeza', label: 'Cabeza' },
      { id: 'cuello', label: 'Cuello' },
      { id: 'torax', label: 'Tórax' },
      { id: 'abdomen', label: 'Abdomen' },
      { id: 'brazo-izq', label: 'Brazo izquierdo' },
      { id: 'antebrazo-izq', label: 'Antebrazo izquierdo' },
      { id: 'mano-izq', label: 'Mano izquierda' },
      { id: 'brazo-der', label: 'Brazo derecho' },
      { id: 'antebrazo-der', label: 'Antebrazo derecho' },
      { id: 'mano-der', label: 'Mano derecha' },
      { id: 'muslo-izq', label: 'Muslo izquierdo' },
      { id: 'rodilla-izq', label: 'Rodilla izquierda' },
      { id: 'pantorrilla-izq', label: 'Pantorrilla izquierda' },
      { id: 'pie-izq', label: 'Pie izquierdo' },
      { id: 'muslo-der', label: 'Muslo derecho' },
      { id: 'rodilla-der', label: 'Rodilla derecha' },
      { id: 'pantorrilla-der', label: 'Pantorrilla derecha' },
      { id: 'pie-der', label: 'Pie derecho' }
    ];

    let appData = {
      folders: [{ id: DEFAULT_FOLDER_ID, name: 'Pacientes Generales' }],
      activeFolderId: DEFAULT_FOLDER_ID,
      patients: { [DEFAULT_FOLDER_ID]: [] }
    };

    let currentPatientData = null;
    let selectedRegion = null;

    // Elementos DOM
    const foldersContainer = document.getElementById('foldersContainer');
    const patientListDiv = document.getElementById('patientList');
    const patientFormContainer = document.getElementById('patientFormContainer');
    const addFolderBtn = document.getElementById('addFolderBtn');
    const saveBtn = document.getElementById('savePatientBtn');
    const deletePatientBtn = document.getElementById('deletePatientBtn');
    const newPatientBtn = document.getElementById('newPatientBtn');
    const anamnesisTextarea = document.getElementById('anamnesisText');
    const bodyDiagram = document.getElementById('bodyDiagram');
    const markerDot = document.getElementById('anatomyMarker');
    const markerLabel = document.getElementById('anatomyLabel');
    const regionListDiv = document.getElementById('regionList');

    function loadFromStorage() {
      const stored = localStorage.getItem(STORAGE_KEY);
      if (stored) {
        try {
          const parsed = JSON.parse(stored);
          if (parsed.folders && parsed.patients && parsed.activeFolderId) {
            appData = parsed;
          }
        } catch (e) {}
      }
      if (!appData.folders.length) {
        appData.folders = [{ id: DEFAULT_FOLDER_ID, name: 'Pacientes Generales' }];
        appData.activeFolderId = DEFAULT_FOLDER_ID;
        appData.patients[DEFAULT_FOLDER_ID] = [];
      }
      if (!appData.activeFolderId || !appData.folders.find(f => f.id === appData.activeFolderId)) {
        appData.activeFolderId = appData.folders[0].id;
      }
    }

    function saveToStorage() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
    }

    function escapeHtml(text) {
      return String(text).replace(/[&<>"]/g, function(m) {
        if (m === '&') return '&amp;';
        if (m === '<') return '&lt;';
        if (m === '>') return '&gt;';
        if (m === '"') return '&quot;';
        return m;
      });
    }

    function createEmptyPatient() {
      return {
        id: null,
        folderId: appData.activeFolderId,
        nombres: '',
        apellidos: '',
        edad: '',
        peso: '',
        talla: '',
        antFarmacologicos: '',
        antPatologicos: '',
        patologia: '',
        dolorEVA: '0',
        causaPatologia: '',
        lugarPatologia: '',
        anatomyRegion: null,
        anatomyCoord: null,
        anamnesis: ''
      };
    }

    // Renderizar carpetas
    function renderFolders() {
      foldersContainer.innerHTML = '';
      appData.folders.forEach(folder => {
        const tab = document.createElement('div');
        tab.className = `folder-tab ${folder.id === appData.activeFolderId ? 'active' : ''}`;
        tab.innerHTML = `
          <span>📁 ${escapeHtml(folder.name)}</span>
          ${appData.folders.length > 1 ? '<button class="delete-folder">✕</button>' : ''}
        `;
        tab.addEventListener('click', (e) => {
          if (e.target.classList.contains('delete-folder')) {
            e.stopPropagation();
            deleteFolder(folder.id);
            return;
          }
          setActiveFolder(folder.id);
        });
        foldersContainer.appendChild(tab);
      });
    }

    function setActiveFolder(folderId) {
      if (appData.activeFolderId === folderId) return;
      appData.activeFolderId = folderId;
      saveToStorage();
      renderFolders();
      renderPatientList();
      currentPatientData = createEmptyPatient();
      selectedRegion = null;
      renderPatientForm();
      renderRegionList();
      updateMarker();
    }

    function deleteFolder(folderId) {
      if (appData.folders.length <= 1) {
        alert('Debe existir al menos una carpeta.');
        return;
      }
      if (!confirm('¿Eliminar esta carpeta y todos sus pacientes?')) return;
      appData.folders = appData.folders.filter(f => f.id !== folderId);
      delete appData.patients[folderId];
      if (appData.activeFolderId === folderId) {
        appData.activeFolderId = appData.folders[0].id;
      }
      saveToStorage();
      renderFolders();
      renderPatientList();
      currentPatientData = createEmptyPatient();
      selectedRegion = null;
      renderPatientForm();
      renderRegionList();
      updateMarker();
    }

    function addNewFolder() {
      const name = prompt('Nombre de la nueva carpeta:');
      if (!name || !name.trim()) return;
      const trimmed = name.trim();
      const newId = 'folder_' + Date.now();
      appData.folders.push({ id: newId, name: trimmed });
      appData.patients[newId] = [];
      appData.activeFolderId = newId;
      saveToStorage();
      renderFolders();
      renderPatientList();
      currentPatientData = createEmptyPatient();
      selectedRegion = null;
      renderPatientForm();
      renderRegionList();
      updateMarker();
    }

    // Lista de pacientes
    function renderPatientList() {
      const folderId = appData.activeFolderId;
      const patients = appData.patients[folderId] || [];
      patientListDiv.innerHTML = '';
      
      patients.forEach(p => {
        const div = document.createElement('div');
        div.className = `patient-item ${currentPatientData && currentPatientData.id === p.id ? 'active' : ''}`;
        div.innerHTML = `
          <span>${escapeHtml(p.nombres || p.apellidos || 'Sin nombre')}</span>
          <span class="delete-patient" data-id="${p.id}">✕</span>
        `;
        div.addEventListener('click', (e) => {
          if (e.target.classList.contains('delete-patient')) {
            e.stopPropagation();
            deletePatient(p.id);
            return;
          }
          loadPatient(p);
        });
        patientListDiv.appendChild(div);
      });
    }

    function loadPatient(patient) {
      currentPatientData = { ...patient };
      selectedRegion = patient.anatomyRegion || null;
      renderPatientForm();
      renderRegionList();
      updateMarker();
      renderPatientList();
      deletePatientBtn.style.display = 'inline-block';
    }

    function deletePatient(patientId) {
      if (!confirm('¿Eliminar este paciente?')) return;
      const folderId = appData.activeFolderId;
      appData.patients[folderId] = appData.patients[folderId].filter(p => p.id !== patientId);
      saveToStorage();
      if (currentPatientData && currentPatientData.id === patientId) {
        currentPatientData = createEmptyPatient();
        selectedRegion = null;
        renderPatientForm();
        renderRegionList();
        updateMarker();
        deletePatientBtn.style.display = 'none';
      }
      renderPatientList();
    }

    // Lista de regiones anatómicas
    function renderRegionList() {
      regionListDiv.innerHTML = '';
      ANATOMY_REGIONS.forEach(region => {
        const btn = document.createElement('div');
        btn.className = `region-btn ${selectedRegion === region.id ? 'selected' : ''}`;
        btn.textContent = region.label;
        btn.addEventListener('click', () => {
          selectedRegion = region.id;
          currentPatientData.anatomyRegion = region.id;
          currentPatientData.lugarPatologia = region.label;
          renderRegionList();
          updateMarker();
          // Actualizar campo de lugar
          const lugarInput = document.getElementById('inputLugar');
          if (lugarInput) lugarInput.value = region.label;
        });
        regionListDiv.appendChild(btn);
      });
    }

    function updateMarker() {
      if (!selectedRegion) {
        markerDot.style.display = 'none';
        markerLabel.style.display = 'none';
        return;
      }
      const svgEl = document.querySelector(`#region-${selectedRegion}`);
      if (!svgEl) {
        markerDot.style.display = 'none';
        markerLabel.style.display = 'none';
        return;
      }
      const diagramRect = bodyDiagram.getBoundingClientRect();
      const svgRect = bodyDiagram.querySelector('svg').getBoundingClientRect();
      const bbox = svgEl.getBBox();
      const svgElRect = svgEl.getBoundingClientRect();
      
      const cx = bbox.x + bbox.width / 2;
      const cy = bbox.y + bbox.height / 2;
      
      const percentX = ((svgElRect.left - svgRect.left) + svgElRect.width / 2) / svgRect.width * 100;
      const percentY = ((svgElRect.top - svgRect.top) + svgElRect.height / 2) / svgRect.height * 100;
      
      markerDot.style.display = 'block';
      markerDot.style.left = percentX + '%';
      markerDot.style.top = percentY + '%';
      
      const region = ANATOMY_REGIONS.find(r => r.id === selectedRegion);
      markerLabel.style.display = 'block';
      markerLabel.style.left = percentX + '%';
      markerLabel.style.top = (percentY - 6) + '%';
      markerLabel.textContent = region ? region.label : '';
      
      currentPatientData.anatomyCoord = { x: Math.round(percentX), y: Math.round(percentY) };
    }

    // Renderizar formulario
    function renderPatientForm() {
      if (!currentPatientData) currentPatientData = createEmptyPatient();
      const p = currentPatientData;
      
      patientFormContainer.innerHTML = `
        <div class="row-duo">
          <div class="input-group">
            <label>👤 Nombres</label>
            <input type="text" id="inputNombres" value="${escapeHtml(p.nombres)}" placeholder="Nombres del paciente">
          </div>
          <div class="input-group">
            <label>👥 Apellidos</label>
            <input type="text" id="inputApellidos" value="${escapeHtml(p.apellidos)}" placeholder="Apellidos">
          </div>
        </div>
        <div class="row-duo">
          <div class="input-group">
            <label>🎂 Edad</label>
            <input type="number" id="inputEdad" value="${escapeHtml(p.edad)}" placeholder="Edad" min="0">
          </div>
          <div class="input-group">
            <label>⚖️ Peso (kg)</label>
            <input type="text" id="inputPeso" value="${escapeHtml(p.peso)}" placeholder="Peso en kg">
          </div>
          <div class="input-group">
            <label>📏 Talla (cm)</label>
            <input type="text" id="inputTalla" value="${escapeHtml(p.talla)}" placeholder="Talla en cm">
          </div>
        </div>
        <div class="row-duo">
          <div class="input-group">
            <label>💊 Antecedentes farmacológicos</label>
            <input type="text" id="inputAntFarm" value="${escapeHtml(p.antFarmacologicos)}" placeholder="Medicamentos actuales o previos">
          </div>
          <div class="input-group">
            <label>🩺 Antecedentes patológicos</label>
            <input type="text" id="inputAntPat" value="${escapeHtml(p.antPatologicos)}" placeholder="Enfermedades previas">
          </div>
        </div>
        <div class="row-duo">
          <div class="input-group">
            <label>🩻 Patología</label>
            <input type="text" id="inputPatologia" value="${escapeHtml(p.patologia)}" placeholder="Diagnóstico actual">
          </div>
          <div class="input-group">
            <label>😣 Dolor EVA (1-10)</label>
            <div class="pain-range">
              <input type="range" id="inputDolorEVA" min="0" max="10" value="${p.dolorEVA || '0'}" step="1" style="flex:1;">
              <span class="pain-value" id="painValueDisplay">${p.dolorEVA || '0'}</span>
            </div>
          </div>
        </div>
        <div class="input-group">
          <label>🔍 Causa de la patología</label>
          <input type="text" id="inputCausa" value="${escapeHtml(p.causaPatologia)}" placeholder="Origen o causa de la patología">
        </div>
        <div class="input-group">
          <label>📍 Lugar de la patología</label>
          <input type="text" id="inputLugar" value="${escapeHtml(p.lugarPatologia)}" placeholder="Región anatómica afectada">
        </div>
      `;

      if (anamnesisTextarea) {
        anamnesisTextarea.value = p.anamnesis || '';
      }

      // Event listeners
      document.getElementById('inputNombres').addEventListener('input', e => currentPatientData.nombres = e.target.value);
      document.getElementById('inputApellidos').addEventListener('input', e => currentPatientData.apellidos = e.target.value);
      document.getElementById('inputEdad').addEventListener('input', e => currentPatientData.edad = e.target.value);
      document.getElementById('inputPeso').addEventListener('input', e => currentPatientData.peso = e.target.value);
      document.getElementById('inputTalla').addEventListener('input', e => currentPatientData.talla = e.target.value);
      document.getElementById('inputAntFarm').addEventListener('input', e => currentPatientData.antFarmacologicos = e.target.value);
      document.getElementById('inputAntPat').addEventListener('input', e => currentPatientData.antPatologicos = e.target.value);
      document.getElementById('inputPatologia').addEventListener('input', e => currentPatientData.patologia = e.target.value);
      document.getElementById('inputCausa').addEventListener('input', e => currentPatientData.causaPatologia = e.target.value);
      document.getElementById('inputLugar').addEventListener('input', e => {
        currentPatientData.lugarPatologia = e.target.value;
        // Si el texto coincide con una región, seleccionarla
        const region = ANATOMY_REGIONS.find(r => r.label.toLowerCase() === e.target.value.toLowerCase());
        if (region) {
          selectedRegion = region.id;
          currentPatientData.anatomyRegion = region.id;
          renderRegionList();
          updateMarker();
        }
      });
      
      const dolorSlider = document.getElementById('inputDolorEVA');
      const painDisplay = document.getElementById('painValueDisplay');
      dolorSlider.addEventListener('input', (e) => {
        currentPatientData.dolorEVA = e.target.value;
        painDisplay.textContent = e.target.value;
      });
    }

    function saveCurrentPatient() {
      if (!currentPatientData.nombres.trim() && !currentPatientData.apellidos.trim()) {
        alert('Ingrese al menos nombres o apellidos del paciente.');
        return;
      }
      
      currentPatientData.anamnesis = anamnesisTextarea.value;
      currentPatientData.folderId = appData.activeFolderId;
      
      const folderId = appData.activeFolderId;
      if (!appData.patients[folderId]) appData.patients[folderId] = [];
      
      if (currentPatientData.id) {
        const index = appData.patients[folderId].findIndex(p => p.id === currentPatientData.id);
        if (index !== -1) appData.patients[folderId][index] = { ...currentPatientData };
      } else {
        currentPatientData.id = 'pat_' + Date.now();
        appData.patients[folderId].push({ ...currentPatientData });
      }
      
      saveToStorage();
      renderPatientList();
      deletePatientBtn.style.display = 'inline-block';
      alert('✅ Paciente guardado correctamente.');
    }

    // Eventos
    addFolderBtn.addEventListener('click', addNewFolder);
    saveBtn.addEventListener('click', saveCurrentPatient);
    newPatientBtn.addEventListener('click', () => {
      currentPatientData = createEmptyPatient();
      selectedRegion = null;
      renderPatientForm();
      renderRegionList();
      updateMarker();
      renderPatientList();
      deletePatientBtn.style.display = 'none';
    });
    deletePatientBtn.addEventListener('click', () => {
      if (currentPatientData && currentPatientData.id) {
        deletePatient(currentPatientData.id);
      }
    });
    anamnesisTextarea.addEventListener('input', (e) => {
      if (currentPatientData) currentPatientData.anamnesis = e.target.value;
    });

    // Click en diagrama para seleccionar región
    bodyDiagram.addEventListener('click', (e) => {
      const target = e.target.closest('[id^="region-"]');
      if (target) {
        const regionId = target.id.replace('region-', '');
        selectedRegion = regionId;
        currentPatientData.anatomyRegion = regionId;
        const region = ANATOMY_REGIONS.find(r => r.id === regionId);
        if (region) {
          currentPatientData.lugarPatologia = region.label;
          const lugarInput = document.getElementById('inputLugar');
          if (lugarInput) lugarInput.value = region.label;
        }
        renderRegionList();
        updateMarker();
      }
    });

    // Inicialización
    function init() {
      loadFromStorage();
      renderFolders();
      currentPatientData = createEmptyPatient();
      selectedRegion = null;
      renderPatientList();
      renderPatientForm();
      renderRegionList();
      updateMarker();
      deletePatientBtn.style.display = 'none';
    }

    init();
  })();
</script>
</body>
</html>
